<title>Basel Rule Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F4F5F8; --surface:#FFFFFF; --sunk:#ECEEF4; --hover:#E3E7F0;
  --ink:#11141C; --ink-2:#3D4457; --ink-3:#6B7386;
  --rule:#D6DAE4; --rule-2:#E6E9F0;
  --accent:#26355C; --accent-soft:#E7EAF3; --accent-line:#8494BE;
  --ok:#2F6B4F; --warn:#8A5E10; --crit:#8E2A2A;
  --ok-bg:#E6EFEA; --warn-bg:#F5EEDD; --crit-bg:#F5E5E5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1218; --surface:#161A23; --sunk:#1C2130; --hover:#232A3B;
    --ink:#E5E8EF; --ink-2:#AEB6C6; --ink-3:#7E879B;
    --rule:#2A3040; --rule-2:#222836;
    --accent:#9DB0DE; --accent-soft:#1D2436; --accent-line:#4A5878;
    --ok:#7FC3A0; --warn:#D9AC5C; --crit:#E08A8A;
    --ok-bg:#16241D; --warn-bg:#2A2416; --crit-bg:#2A1919;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1218; --surface:#161A23; --sunk:#1C2130; --hover:#232A3B;
  --ink:#E5E8EF; --ink-2:#AEB6C6; --ink-3:#7E879B;
  --rule:#2A3040; --rule-2:#222836;
  --accent:#9DB0DE; --accent-soft:#1D2436; --accent-line:#4A5878;
  --ok:#7FC3A0; --warn:#D9AC5C; --crit:#E08A8A;
  --ok-bg:#16241D; --warn-bg:#2A2416; --crit-bg:#2A1919;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.sans{font-family:"IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---------- shell ---------- */
.app{display:flex; flex-direction:column; height:100vh; max-width:1500px; margin:0 auto}
header{
  border-bottom:1px solid var(--rule); padding:18px 26px 14px;
  display:flex; flex-wrap:wrap; gap:14px 26px; align-items:baseline;
}
h1{font-size:22px; font-weight:600; letter-spacing:-.015em; margin:0; white-space:nowrap}
.sub{font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; color:var(--ink-3); flex:1; min-width:220px}
.sub b{color:var(--ink-2); font-variant-numeric:tabular-nums}
.search{
  font-family:"IBM Plex Sans",sans-serif; font-size:13.5px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--rule); border-radius:4px; padding:7px 11px; width:270px;
}
.search:focus{outline:2px solid var(--accent-line); outline-offset:1px; border-color:var(--accent-line)}
.search::placeholder{color:var(--ink-3)}

.body{display:grid; grid-template-columns:minmax(300px,400px) 1fr; flex:1; min-height:0}
nav{border-right:1px solid var(--rule); overflow-y:auto; padding:12px 8px 40px}
main{overflow-y:auto; padding:24px 30px 60px}

/* ---------- tree ---------- */
.tnode{margin:0}
.trow{
  display:flex; align-items:flex-start; gap:6px; width:100%;
  background:none; border:0; text-align:left; cursor:pointer;
  font:inherit; color:inherit; padding:5px 8px; border-radius:4px; line-height:1.35;
}
.trow:hover{background:var(--hover)}
.trow[aria-current="true"]{background:var(--accent-soft)}
.trow[aria-current="true"] .tlabel{color:var(--accent); font-weight:600}
.trow:focus-visible{outline:2px solid var(--accent-line); outline-offset:-2px}
.chev{
  flex:0 0 14px; width:14px; height:20px; color:var(--ink-3);
  display:flex; align-items:center; justify-content:center;
  transition:transform .14s ease; font-size:9px;
}
.chev.leaf{opacity:0}
.tnode.open>.trow .chev{transform:rotate(90deg)}
.tlabel{flex:1; font-size:14px; color:var(--ink-2)}
.tcount{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  flex:0 0 auto; padding-top:2px; font-variant-numeric:tabular-nums;
}
.kids{margin-left:15px; padding-left:9px; border-left:1px solid var(--rule-2); display:none}
.tnode.open>.kids{display:block}
.tnode.hit>.trow .tlabel{color:var(--accent)}
.tnode.dim{display:none}

/* ---------- detail ---------- */
.crumb{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 10px}
h2{font-size:27px; font-weight:600; letter-spacing:-.02em; margin:0 0 10px; text-wrap:balance}
.desc{font-size:17px; color:var(--ink-2); margin:0 0 16px; max-width:66ch}
.note{
  background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--accent-line);
  border-radius:0 4px 4px 0; padding:13px 17px; margin:0 0 20px; max-width:72ch;
  font-size:15.5px; color:var(--ink-2);
}
.status{
  display:inline-block; font-family:"IBM Plex Sans",sans-serif; font-size:11px; font-weight:600;
  padding:.2em .6em; border-radius:3px; margin:0 0 16px;
}
.st-pending{background:var(--warn-bg); color:var(--warn)}
.st-scope{background:var(--sunk); color:var(--ink-3)}

.childgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin:0 0 26px}
.childcard{
  background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  padding:12px 14px; cursor:pointer; text-align:left; font:inherit; color:inherit;
}
.childcard:hover{border-color:var(--accent-line); background:var(--hover)}
.childcard:focus-visible{outline:2px solid var(--accent-line); outline-offset:1px}
.childcard .cl{font-size:14.5px; font-weight:600; color:var(--ink); display:block; margin-bottom:3px}
.childcard .cc{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}

.secthead{
  font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  border-bottom:1px solid var(--rule); padding-bottom:7px; margin:8px 0 16px;
}
.rule{border-bottom:1px solid var(--rule-2); padding:16px 0; max-width:76ch}
.rule:last-child{border-bottom:0}
.rhead{display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; margin-bottom:5px}
.rtitle{font-size:17px; font-weight:600; letter-spacing:-.01em}
.rstate{margin:0 0 10px; color:var(--ink-2)}
.quote{
  border-left:2px solid var(--accent-line); padding:2px 0 2px 14px; margin:0 0 10px;
  font-style:italic; color:var(--ink-2); font-size:15.5px;
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  font-family:"IBM Plex Mono",monospace; font-size:11px; padding:.2em .5em;
  border-radius:3px; background:var(--sunk); color:var(--ink-3); white-space:nowrap;
}
.chip.cite{background:var(--accent-soft); color:var(--accent); font-weight:500}
.chip.num{background:var(--ok-bg); color:var(--ok); font-weight:500}
.ob{
  font-family:"IBM Plex Sans",sans-serif; font-size:10.5px; font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; padding:.22em .5em; border-radius:3px;
}
.ob-must{background:var(--crit-bg); color:var(--crit)}
.ob-should{background:var(--warn-bg); color:var(--warn)}
.ob-may{background:var(--sunk); color:var(--ink-3)}
.ob-definition{background:var(--accent-soft); color:var(--accent)}
.rel{font-size:14.5px; color:var(--ink-3); margin:8px 0 0}
.empty{color:var(--ink-3); font-style:italic; max-width:64ch}
mark{background:var(--warn-bg); color:inherit; padding:0 1px; border-radius:2px}

@media (max-width:880px){
  .body{grid-template-columns:1fr; grid-template-rows:minmax(180px,34vh) 1fr}
  nav{border-right:0; border-bottom:1px solid var(--rule)}
  main{padding:20px}
  header{padding:14px 18px 12px}
  .search{width:100%}
}
</style>

<div class="app">
  <header>
    <h1>Basel Rule Atlas</h1>
    <p class="sub" id="sub"></p>
    <input class="search" id="q" type="search" placeholder="Search rules and branches…" autocomplete="off">
  </header>
  <div class="body">
    <nav id="tree" aria-label="Rule taxonomy"></nav>
    <main id="detail" tabindex="-1"></main>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;
const TREE = DATA.tree, RULES = DATA.rules;

const byId = {}, parentOf = {};
(function index(n, parent){
  byId[n.id] = n; parentOf[n.id] = parent;
  n.children.forEach(c => index(c, n.id));
})(TREE, null);

const leafCount = Object.values(byId).filter(n => !n.children.length).length;
document.getElementById('sub').innerHTML =
  `<b>${Object.keys(RULES).length}</b> rules · <b>${Object.keys(byId).length}</b> branches · ` +
  `<b>${leafCount}</b> leaves · every rule quotes its source paragraph verbatim`;

/* ---------- tree ---------- */
const nav = document.getElementById('tree');
function renderTree(n, depth){
  const el = document.createElement('div');
  el.className = 'tnode';
  el.dataset.id = n.id;
  if (depth < 1) el.classList.add('open');

  const row = document.createElement('button');
  row.className = 'trow';
  row.type = 'button';
  row.innerHTML =
    `<span class="chev${n.children.length ? '' : ' leaf'}">▶</span>` +
    `<span class="tlabel"></span><span class="tcount">${n.t}</span>`;
  row.querySelector('.tlabel').textContent = n.label;
  row.addEventListener('click', e => {
    if (n.children.length && e.offsetX < 22) { el.classList.toggle('open'); return; }
    select(n.id);
    if (n.children.length) el.classList.add('open');
  });
  el.appendChild(row);

  if (n.children.length){
    const kids = document.createElement('div');
    kids.className = 'kids';
    n.children.forEach(c => kids.appendChild(renderTree(c, depth + 1)));
    el.appendChild(kids);
  }
  return el;
}
nav.appendChild(renderTree(TREE, 0));

/* ---------- detail ---------- */
const detail = document.getElementById('detail');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function crumbs(id){
  const path = []; let cur = id;
  while (cur){ path.unshift(byId[cur].label); cur = parentOf[cur]; }
  return path.join('  ›  ');
}

function ruleCard(rid){
  const r = RULES[rid];
  const chips = [`<span class="chip cite">${esc(r.c)}</span>`]
    .concat((r.v || []).slice(0, 6).map(v => `<span class="chip num">${esc(v)}</span>`))
    .concat((r.p || []).filter(p => p !== 'all').map(p => `<span class="chip">${esc(p)}</span>`));
  return `<article class="rule">
    <div class="rhead">
      <span class="ob ob-${esc(r.o)}">${esc(r.o)}</span>
      <span class="rtitle">${esc(r.t)}</span>
    </div>
    <p class="rstate">${esc(r.s)}</p>
    <blockquote class="quote">${esc(r.q)}</blockquote>
    ${r.r ? `<p class="rel">${esc(r.r)}</p>` : ''}
    <div class="chips">${chips.join('')}</div>
  </article>`;
}

function select(id){
  const n = byId[id];
  if (!n) return;
  history.replaceState(null, '', '#' + id);
  nav.querySelectorAll('.trow').forEach(b => b.removeAttribute('aria-current'));
  const row = nav.querySelector(`.tnode[data-id="${CSS.escape(id)}"] > .trow`);
  if (row){
    row.setAttribute('aria-current', 'true');
    let p = row.parentElement.parentElement;
    while (p && p.classList){ if (p.classList.contains('tnode')) p.classList.add('open'); p = p.parentElement; }
    row.scrollIntoView({block:'nearest'});
  }

  let html = `<p class="crumb">${esc(crumbs(id))}</p><h2>${esc(n.label)}</h2>`;
  if (n.desc) html += `<p class="desc">${esc(n.desc)}</p>`;
  if (n.status === 'not-yet-extracted')
    html += `<p><span class="status st-pending">extraction not yet run for this branch</span></p>`;
  if (n.status === 'out-of-scope')
    html += `<p><span class="status st-scope">deliberately out of scope</span></p>`;
  if (n.note) html += `<p class="note">${esc(n.note)}</p>`;

  if (n.children.length){
    html += `<div class="secthead">Branches</div><div class="childgrid">` +
      n.children.map(c => `<button class="childcard" type="button" data-go="${esc(c.id)}">
        <span class="cl">${esc(c.label)}</span>
        <span class="cc">${c.t} rule${c.t === 1 ? '' : 's'}${c.status ? ' · ' + esc(c.status).replace(/-/g,' ') : ''}</span>
      </button>`).join('') + `</div>`;
  }

  if (n.rules.length){
    html += `<div class="secthead">${n.rules.length} rule${n.rules.length === 1 ? '' : 's'} on this branch</div>`;
    html += n.rules.map(ruleCard).join('');
  } else if (!n.children.length){
    html += `<p class="empty">No rules extracted onto this branch yet. The taxonomy carries it so the gap is visible rather than silent.</p>`;
  }

  detail.innerHTML = html;
  detail.scrollTop = 0;
  detail.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => select(b.dataset.go)));
}

/* ---------- search ---------- */
const q = document.getElementById('q');
q.addEventListener('input', () => {
  const term = q.value.trim().toLowerCase();
  const nodes = nav.querySelectorAll('.tnode');
  if (!term){
    nodes.forEach(el => { el.classList.remove('dim','hit'); });
    nav.querySelectorAll('.tnode').forEach((el,i) => el.classList.toggle('open', i === 0));
    return;
  }
  const matches = new Set();
  Object.values(byId).forEach(n => {
    const inLabel = (n.label + ' ' + n.desc).toLowerCase().includes(term);
    const inRules = n.rules.some(rid => {
      const r = RULES[rid];
      return (r.t + ' ' + r.s + ' ' + r.q + ' ' + r.c).toLowerCase().includes(term);
    });
    if (inLabel || inRules){
      matches.add(n.id);
      let p = parentOf[n.id];
      while (p){ matches.add(p); p = parentOf[p]; }
    }
  });
  nodes.forEach(el => {
    const hit = matches.has(el.dataset.id);
    el.classList.toggle('dim', !hit);
    el.classList.toggle('open', hit);
    el.classList.toggle('hit', hit && (byId[el.dataset.id].label + ' ' + byId[el.dataset.id].desc)
      .toLowerCase().includes(term));
  });
});

select(location.hash.slice(1) && byId[location.hash.slice(1)] ? location.hash.slice(1) : 'root');
</script>
